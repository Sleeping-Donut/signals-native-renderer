[package]
name = "renderer-native"
description = "Native paint backend, wgpu scene renderer, and window loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renderer-api = { path = "../renderer-api" }
scene = { path = "../scene" }
text = { path = "../text" }
accesskit = "0.25"
pollster = "0.3"
wgpu = "0.19.4"
winit = { version = "0.29.15", optional = true }

[dev-dependencies]
layout = { path = "../layout" }
reactive-core = { path = "../reactive-core" }
renderer-null = { path = "../renderer-null" }
text = { path = "../text" }
view = { path = "../view" }

[[example]]
name = "window"
required-features = ["window"]

[[example]]
name = "window_smoke"
required-features = ["window"]

[[example]]
name = "counter"
required-features = ["window"]

[features]
default = []
window = ["dep:winit"]

[package]
name = "renderer-native"
description = "Native paint backend, wgpu scene renderer, and window loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
renderer-api = { path = "../renderer-api" }
scene = { path = "../scene" }
text = { path = "../text" }
accesskit = "0.25"
pollster = "0.3"
wgpu = "0.19.4"
winit = { version = "0.30.5", optional = true }
accesskit_winit = { version = "0.34.2", optional = true }

[dev-dependencies]
macros = { path = "../macros" }
reactive-stores = { path = "../reactive-stores" }
layout = { path = "../layout" }
reactive-core = { path = "../reactive-core" }
renderer-null = { path = "../renderer-null" }
text = { path = "../text" }
view = { path = "../view" }

[[example]]
name = "window"
required-features = ["window"]

[[example]]
name = "window_smoke"
required-features = ["window"]

[[example]]
name = "counter"
required-features = ["window"]

[[example]]
name = "counter_manual"
required-features = ["window"]

[[example]]
name = "todos"
required-features = ["window"]
test = true

[[example]]
name = "states"
required-features = ["window"]

[[example]]
name = "states_manual"
required-features = ["window"]

[[example]]
name = "store_counter"
required-features = ["window"]

[features]
default = []
window = ["dep:winit", "dep:accesskit_winit"]

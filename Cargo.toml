[workspace]
resolver = "2"
members = [
    "crates/reactive-core",
    "crates/renderer-api",
    "crates/renderer-null",
    "crates/runtime",
    "crates/view",
    "crates/macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/Sleeping-Donut/signals-native-renderer"
